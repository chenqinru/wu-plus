name: Wu Plus candidate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      wu_version:
        description: '预期的上游 Wu 标签，留空使用当前提交的固定版本'
        type: string
      rust_cache:
        description: '使用 macOS 和 Windows 的 Rust 构建缓存'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  ZED_RELEASE_CHANNEL: stable

concurrency:
  group: wu-plus-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_WU: ${{ inputs.wu_version }}
        run: |
          tag=$(jq -er .tag scripts/wu-upstream.json)
          revision=$(jq -er .revision scripts/wu-upstream.json)
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          upstream_version=$(awk -F '"' '/^version = / {print $2; exit}' crates/wu/Cargo.toml)
          if [[ $upstream_version != "${tag#v}" || ! $upstream_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Cargo 版本 %s 必须与上游 Wu 标签 %s 一致。\n' "$upstream_version" "$tag" >&2
            exit 1
          fi
          release_revision=$(<crates/release_channel/WU_PLUS_REVISION)
          if [[ ! $release_revision =~ ^[1-9][0-9]*$ ]]; then
            printf 'Wu Plus 修订号必须是正整数。\n' >&2
            exit 1
          fi
          version="$upstream_version.$release_revision"
          if [[ -n $REQUESTED_WU && $REQUESTED_WU != "$tag" ]]; then
            printf '此提交固定在 Wu %s，请先在集成分支合入目标版本。\n' "$tag" >&2
            exit 1
          fi
          needed=true
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            latest=$(scripts/upstream-release.sh | jq -er .tag)
            if [[ $latest != "$tag" ]]; then
              printf '上游已发布 %s，当前提交仍固定在 %s。\n' "$latest" "$tag" >> "$GITHUB_STEP_SUMMARY"
            fi
            artifacts=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="wu-plus-candidate-$GITHUB_SHA")
            if jq -e 'any(.artifacts[]; .expired == false)' <<<"$artifacts" >/dev/null; then
              needed=false
            fi
          fi
          printf 'version=%s\nneeded=%s\n' "$version" "$needed" >> "$GITHUB_OUTPUT"

  bundle-macos:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        component: [ide, remote-server]
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install lld cmake pkgconf
      - name: Cache macOS Rust dependencies
        if: github.event_name == 'schedule' || inputs.rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wu-plus-candidate-${{ matrix.arch }}
          cache-bin: false
          save-if: ${{ matrix.component == 'ide' }}
      - name: Test Subversion backend
        if: matrix.component == 'ide' && matrix.arch == 'aarch64'
        run: |
          brew install subversion
          cargo test --locked --manifest-path plugin/Cargo.toml
      - name: Prepare provisioning profile
        if: matrix.component == 'ide'
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [[ -n $MACOS_PROVISIONING_PROFILE_BASE64 ]]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"
            printf 'MACOS_PROVISIONING_PROFILE=%s\n' "$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle and sign macOS ${{ matrix.component }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BUNDLE_MODE: ${{ matrix.component == 'ide' && '-s' || '-r' }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac "$BUNDLE_MODE" "$TARGET_ARCH-apple-darwin"
      - name: Check Simplified Chinese strings and commands
        if: matrix.component == 'ide' && matrix.arch == 'aarch64'
        run: script/check-translations --binary target/aarch64-apple-darwin/release/wu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.component == 'ide'
        with:
          name: wu-plus-debug-symbols-macos-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-apple-darwin/release/Wu.dSYM.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30
      - name: Upload macOS release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wu-plus-bundle-macos-${{ matrix.arch }}${{ matrix.component == 'remote-server' && '-remote-server' || '' }}
          path: >-
            ${{ matrix.component == 'ide'
                && format('target/{0}-apple-darwin/release/Wu-Plus-{0}.dmg', matrix.arch)
                || format('target/wu-remote-server-macos-{0}.gz', matrix.arch) }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  bundle-linux:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    timeout-minutes: 300
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: script/linux
      - name: Test Subversion backend
        run: |
          sudo apt-get install -y subversion
          cargo test --locked --manifest-path plugin/Cargo.toml
      - name: Bundle as upstream Wu
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          script/bundle-linux
          mkdir "$RUNNER_TEMP/bundle"
          cp "target/release/wu-plus-linux-$TARGET_ARCH.tar.gz" \
            "target/wu-remote-server-linux-$TARGET_ARCH.gz" "$RUNNER_TEMP/bundle/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wu-plus-bundle-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundle/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  bundle-windows:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache Windows Rust dependencies
        if: github.event_name == 'schedule' || inputs.rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wu-plus-candidate-windows-x86_64
          cache-bin: false
      - name: Test Subversion backend
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path = "${env:ProgramFiles}\SlikSvn\bin;$env:Path"
          svn --version --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path plugin/Cargo.toml
      - name: Bundle as upstream Wu
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wu-plus-bundle-windows-x86_64
          path: |
            target/Wu-Plus-x86_64.exe
            target/wu-remote-server-windows-x86_64.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  manifest:
    needs: [discover, bundle-macos, bundle-linux, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wu-plus-bundle-*
          path: bundles
          merge-multiple: true
      - name: Record candidate assets and checksums
        env:
          VERSION: ${{ needs.discover.outputs.version }}
        run: |
          upstream_tag=$(jq -er .tag scripts/wu-upstream.json)
          {
            cat .github/release/body.md
            printf '\n## Upstream Wu %s\n\n' "$upstream_tag"
            script/changelog-section "${upstream_tag#v}"
          } > "$RUNNER_TEMP/RELEASE_NOTES.md"
          cd bundles
          printf '%s\n' "$VERSION" > version.txt
          cp "$RUNNER_TEMP/RELEASE_NOTES.md" .
          sha256sum version.txt RELEASE_NOTES.md \
            Wu-Plus-{aarch64,x86_64}.dmg Wu-Plus-x86_64.exe \
            wu-plus-linux-{aarch64,x86_64}.tar.gz \
            wu-remote-server-{macos,linux}-{aarch64,x86_64}.gz wu-remote-server-windows-x86_64.gz > "$RUNNER_TEMP/SHA256SUMS"
          cp version.txt "$RUNNER_TEMP/version.txt"
          {
            printf '### Wu Plus %s\n\n' "$VERSION"
            printf '确认各平台候选安装包后，用以下 SHA-256 运行发布工作流。\n\n'
            sha256sum "$RUNNER_TEMP/SHA256SUMS" | cut -d ' ' -f 1
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wu-plus-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true
          retention-days: 30

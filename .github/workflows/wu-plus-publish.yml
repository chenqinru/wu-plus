name: Wu Plus publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: '已验收的 Wu Plus candidate 工作流运行 ID'
        required: true
        type: string
      approved_manifest_sha256:
        description: '候选运行摘要中 SHA256SUMS 的 SHA-256'
        required: true
        type: string

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: wu-plus-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    environment: wu-plus-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      APPROVED_SHA: ${{ inputs.approved_manifest_sha256 }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - id: candidate
        run: |
          [[ $CANDIDATE_RUN_ID =~ ^[1-9][0-9]*$ && $APPROVED_SHA =~ ^[0-9a-f]{64}$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
          revision=$(jq -er --arg branch "$DEFAULT_BRANCH" --arg repository "$GITHUB_REPOSITORY" '
            select(.conclusion == "success" and .path == ".github/workflows/wu-plus-candidate.yml"
              and .head_branch == $branch and .head_repository.full_name == $repository
              and (.event == "schedule" or .event == "workflow_dispatch")) | .head_sha' <<<"$run")
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wu-plus-candidate-${{ steps.candidate.outputs.revision }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: manifest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wu-plus-bundle-*
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: bundles
          merge-multiple: true
      - name: Verify and publish the approved files
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          version=$(cat manifest/version.txt)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="wu-plus-v$version"
          [[ $(sha256sum manifest/SHA256SUMS | cut -d ' ' -f 1) == "$APPROVED_SHA" ]]
          cd bundles
          assets=(
            Wu-Plus-{aarch64,x86_64}.dmg Wu-Plus-x86_64.exe
            wu-plus-linux-{aarch64,x86_64}.tar.gz
            wu-remote-server-{macos,linux}-{aarch64,x86_64}.gz wu-remote-server-windows-x86_64.gz
          )
          cp ../manifest/{version.txt,RELEASE_NOTES.md} .
          diff -u ../manifest/SHA256SUMS <(sha256sum version.txt RELEASE_NOTES.md "${assets[@]}")
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 20 --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')
          if [[ -n $latest ]]; then
            python3 - "$latest" "$version" <<'PY'
          import re
          import sys
          latest, version = sys.argv[1:]
          match = re.fullmatch(r"wu-plus-v(\d+\.\d+\.\d+)", latest)
          if match is None or tuple(map(int, version.split("."))) <= tuple(map(int, match[1].split("."))):
              sys.exit("The release version must be newer than the current Wu Plus release.")
          PY
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null); then
            jq -e --arg target "$REVISION" '.isDraft and .targetCommitish == $target' <<<"$draft" >/dev/null
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$REVISION" \
              --title "Wu Plus $version" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${assets[@]}" version.txt ../manifest/SHA256SUMS --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md --draft=false --latest

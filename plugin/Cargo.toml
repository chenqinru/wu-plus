[package]
name = "wu-plus-subversion-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"

[dependencies]
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }

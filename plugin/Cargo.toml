[package]
name = "wu-plus-subversion-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"

[dependencies]
dunce = "1.0"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Build the independently shipped provider with its own dependency lockfile.
[workspace]
